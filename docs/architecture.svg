<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">점검실 구현 구조</title><desc id="desc">React 작업대에서 Express API로 요청하고 MCP Client와 Server를 통해 로컬 HTTP와 PostgreSQL을 점검한다. 선택한 LLM 모드는 제한된 도구를 추가 호출하며 서버가 정상 확인을 판단한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8b9bb0"/></marker></defs><rect width="1200" height="530" rx="20" fill="#f5f7fb"/><g font-family="Segoe UI,Malgun Gothic,sans-serif"><text x="35" y="45" font-size="13" font-weight="700" letter-spacing="2" fill="#53647b">JEOMGEOMSIL / IMPLEMENTED ARCHITECTURE</text><text x="35" y="80" font-size="24" font-weight="700" fill="#1d2d44">확인 근거를 수집하고, 서버에서 재검증을 판단합니다.</text><g stroke="#8b9bb0" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M230 240H280"/><path d="M490 240H540"/><path d="M750 240H800"/><path d="M1010 240H1050"/><path d="M645 155V190" stroke-dasharray="5 5"/><path d="M1130 290V340"/><path d="M1050 385H380V290" marker-start="url(#arrow)"/><path d="M905 290V350H1050"/><path d="M490 210H515V130H540" stroke-dasharray="5 5"/></g><g fill="#fff" stroke="#dce4ef"><rect x="30" y="190" width="200" height="100" rx="12"/><rect x="280" y="190" width="210" height="100" rx="12"/><rect x="540" y="190" width="210" height="100" rx="12"/><rect x="800" y="190" width="210" height="100" rx="12"/><rect x="1050" y="190" width="120" height="100" rx="12"/><rect x="540" y="105" width="210" height="50" rx="10" fill="#eeeefa"/><rect x="1050" y="340" width="120" height="90" rx="12" fill="#ecf5f1"/></g><g font-size="17" font-weight="700" fill="#23344c"><text x="49" y="226">작업대</text><text x="300" y="226">장애 · 점검 API</text><text x="560" y="226">MCP Client</text><text x="820" y="226">MCP Server</text><text x="1066" y="226">HTTP Lab</text><text x="1066" y="373">PGlite</text></g><g font-size="12" fill="#63738b"><text x="49" y="253">React · TypeScript</text><text x="49" y="272">접수 / 근거 / 가이드</text><text x="300" y="253">Express · 상태 검증</text><text x="300" y="272">입력 검증 / 직렬 실행</text><text x="560" y="253">도구 목록 조회 · 호출</text><text x="560" y="272">linked in-memory transport</text><text x="820" y="253">기동 / HTTP / SQL / 기능</text><text x="820" y="272">가이드 검색 · 고정된 대상</text><text x="1066" y="253">실제 리스너</text><text x="1066" y="272">장애 3종</text><text x="1066" y="400">PostgreSQL</text><text x="1066" y="418">.data 영속 저장</text><text x="562" y="135" fill="#625b9a">OpenAI API · 선택 모드</text><text x="918" y="339">SQL 직접 조회</text><text x="555" y="318">실제 SDK JSON-RPC 통신</text><text x="505" y="376">장애 · 실행 근거 · 가이드 저장</text></g><rect x="30" y="450" width="1140" height="52" rx="10" fill="#e8edf7"/><text x="53" y="481" font-size="14" font-weight="600" fill="#34496b">저장 조건: 최근 실패 근거 + 현재 환경의 필수 재검증 통과 · 환경 변경 시 정상 확인 만료</text></g></svg>